name: Verify Phase 6
# Manual by default: never silently consume private-repository Actions minutes.
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: development
      OPENAI_API_KEY: ''
      DEEPSEEK_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Documentation integrity
        run: |
          python scripts/check_docs.py
          python -m unittest discover -s scripts/tests -q
      - name: Install CPU test environment
        run: |
          python -c "import os,secrets; open(os.environ['GITHUB_ENV'],'a').write('SECRET_KEY='+secrets.token_hex(32)+'\n')"
          python deploy/ci_requirements.py > /tmp/yolo-ci.lock
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r /tmp/yolo-ci.lock
          python -m pip check
      - name: Backend (private checkpoint tests run on lab host)
        working-directory: backend
        run: python -m pytest -q -m 'not checkpoints'
      - name: Deployment tools
        run: python -m unittest discover -s deploy/tests -q
      - name: Frontend production build
        working-directory: web-frontend
        run: |
          npm ci --include=dev
          VITE_API_BASE_URL='' npm run build
