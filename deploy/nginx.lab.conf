# Linux host-network container; the backend listens on the same host at :8000.
# Keep this entry point on loopback until HTTPS / lab access is configured.
user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Signed media URLs contain credentials in the query; omit query strings.
    log_format yolo '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout yolo;
    server_tokens off;
    sendfile on;

    server {
        listen 127.0.0.1:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 100 x 10 MiB images plus multipart overhead; application limits remain.
        client_max_body_size 1024m;

        # Preserve API errors and protected-media authorization. Do not mount
        # backend/static here or let these paths fall back to the SPA.
        location ~ ^/(api|static|docs|redoc)(/|$)|^/openapi\.json$ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
